# Loadpath architecture manifest — demo billing/identity split.
contexts:
  billing:
    django_apps: [billing]
    react: [src/features/billing, frontend/src/features/billing]
    public_api:
      - "GET /api/invoices"
      - "POST /api/invoices"
      - "GET /api/invoices/{id}"
      - "PUT /api/invoices/{id}"
    owners: [billing-team]
  identity:
    django_apps: [accounts]
    react: [src/features/auth, frontend/src/features/auth]
    public_api:
      - "POST /api/login"
      - "GET /api/me"
    owners: [identity-team]
layers:
  django: [route, view, service, model]
  react: [route, page, feature, shared]
rules:
  - views_cannot_import_other_context_models
  - react_feature_may_only_call_own_or_shared_api
  - serializers_are_the_only_published_contract
  - no_queryset_in_serializer
  - celery_tasks_must_be_idempotent_on_model_pk
  - queryset_nplusone
  - queryset_missing_index
  - cascade_crosses_context
  - migration_blast_radius
django_root: backend
react_root: frontend/src
openapi_paths:
  - openapi.yaml
boot_django: false
